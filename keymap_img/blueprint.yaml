# Settings for draw.py
name: Short Temper
prefix: temper
keymap: keymap_img/temper.yaml
board: keymap_img/temper-board.yaml
sheets:
  Base: {file: base, reach: Tap keys to type. Hold a thumb for a layer.}
  NUM: {file: num, reach: Hold the left inner thumb}
  SYM: {file: sym, reach: Hold the right inner thumb, show_shifted: false}
  NAV: {file: nav, reach: Hold the left outer thumb}
  SYSTEM: {file: system, reach: Hold both inner thumbs}
