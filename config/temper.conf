CONFIG_ZMK_KEYBOARD_NAME="Short Temper"

# Deep sleep after 15 idle minutes on battery. A key press wakes the half.
CONFIG_ZMK_SLEEP=y

# Soft off from the SYSTEM layer. The outer thumb on each half wakes it.
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# The screens: boards/shields/nice_view_legend, added by build.yaml and build.sh
