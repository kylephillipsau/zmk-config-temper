# Enable nice!view
CONFIG_ZMK_DISPLAY=y

# Stop the display's 10 ms update timer after 30 seconds without a key press on this half. The stock
# nice!view config leaves it running, so an idle half wakes 100 times a second, screen or not. The
# screen keeps its picture while stopped, since this panel has no off switch for blanking to use.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Render the whole screen in one pass, so a redraw lands in a single refresh rather than two
# visible steps. The buffer is 1 bit per pixel: 1360 bytes.
CONFIG_LV_Z_VDB_SIZE=100

# The left half sends the active layer to the right half, for its legend
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# LVGL on the default 2 KB display stack overflowed on the Sofle; RAM is plentiful
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
